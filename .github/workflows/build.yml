name: NEXORA CLIENT Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Minecraft Fabric Client
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Upload NEXORA JAR
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-CLIENT
          path: build/libs/*.jar
          if-no-files-found: error
